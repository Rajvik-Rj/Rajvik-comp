name: build
on:
  push:
  pull_request:

# Do not cancel a build just because another commit is pushed while it is compiling.
concurrency:
  group: rdp-vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure VST3-only build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRDP_BUILD_PLUGIN=ON
      - name: Build VST3
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RajvikDynamicsPro-VST3-${{ matrix.os }}
          path: build/RajvikDynamicsPro_artefacts/Release/VST3
          if-no-files-found: error
