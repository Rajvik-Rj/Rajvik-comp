/name: Build Audio Plugins

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-vst3
            generators: "Visual Studio 17 2022"
          - os: macos-14
            artifact: macos-vst3-au
            generators: "Unix Makefiles"
          - os: ubuntu-22.04
            artifact: linux-vst3
            generators: "Unix Makefiles"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target RajvikDynamicsPro_VST3 --parallel 2

      - name: Build AU on macOS
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target RajvikDynamicsPro_AU --parallel 2

      - name: Collect plugin artifacts
        shell: bash
        run: |
          mkdir -p package
          find build -type d \( -name "*.vst3" -o -name "*.component" \) -print
          find build -type d -name "*.vst3" -exec cp -R {} package/ \;
          if [ "$RUNNER_OS" = "macOS" ]; then
            find build -type d -name "*.component" -exec cp -R {} package/ \;
          fi
          if [ -z "$(find package -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "No plugin bundles found. Build output:"
            find build -maxdepth 6 -type f | head -200
            exit 1
          fi

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
          retention-days: 14
