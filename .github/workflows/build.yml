name: Build RAJVIK Dynamics Pro

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows VST3
            os: windows-latest
            artifact: rajvik-dynamics-pro-windows-vst3
          - label: macOS VST3 + AU
            os: macos-14
            artifact: rajvik-dynamics-pro-macos-vst3-au
          - label: Linux VST3
            os: ubuntu-22.04
            artifact: rajvik-dynamics-pro-linux-vst3

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libgtk-3-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxkbcommon-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=OFF -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target RajvikDynamicsPro_VST3 --parallel 2

      - name: Build Audio Unit on macOS
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target RajvikDynamicsPro_AU --parallel 2

      - name: Collect plugin bundles
        shell: bash
        run: |
          mkdir -p package
          find build -type d -name '*.vst3' -prune -exec cp -R '{}' package/ \;
          if [ "$RUNNER_OS" = "macOS" ]; then
            find build -type d -name '*.component' -prune -exec cp -R '{}' package/ \;
          fi
          if [ -z "$(find package -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo 'No plugin bundle found. Build output:'
            find build -maxdepth 7 -print | head -250
            exit 1
          fi
          echo 'Collected plugin bundles:'
          ls -lah package

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
          retention-days: 14
